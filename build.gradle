plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = 'thaumcraft'
version = '0.2.5'

base {
    archivesName = 'thaumcraft4-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Thaumic Tinkerer — отдельный мод-аддон (свой jar, mod id thaumictinkerer), но собирается из этого же проекта:
// так оба мода всегда совпадают по версии и в среде разработки запускаются вместе
sourceSets {
    tinkerer {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    tinkererImplementation.extendsFrom implementation
    tinkererCompileOnly.extendsFrom compileOnly
    tinkererRuntimeOnly.extendsFrom runtimeOnly
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Curios подключён как зависимость и использует миксины: им нужна перекодировка имён в среде разработки
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                thaumcraft {
                    source sourceSets.main
                }
                thaumictinkerer {
                    source sourceSets.tinkerer
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', 'thaumcraft'
            // gradlew runClient -Pautoshot: игра сама снимает проверочные скриншоты и выходит (см. AutoShot)
            if (project.hasProperty('autoshot')) {
                property 'thaumcraft.autoshot', 'true'
                property 'thaumcraft.autoshot.only', project.property('autoshot').toString()
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', 'thaumcraft'
            args '--nogui'
        }

        // Запускает сервер без окна, грузит мод и датапаки и сразу выходит: быстрая проверка, что всё загружается
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'thaumcraft'
            property 'thaumcraft.selfcheck', 'true'
            property 'thaumcraft.selfcheck.items', 'thaumcraft:greatwood_log,thaumcraft:silverwood_log,thaumcraft:greatwood_planks,thaumcraft:silverwood_leaves,thaumcraft:greatwood_sapling,thaumcraft:shimmerleaf,thaumcraft:cinderpearl'
        }
    }
}

// gradlew <задача> -Pneoforge: та же сборка поверх NeoForge 1.20.1 (ответвление Forge 47.1, принимает моды Forge),
// чтобы проверить, что мод не опирается на то, что появилось в Forge позже
def neoforge = project.hasProperty('neoforge')

repositories {
    if (neoforge) {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
    maven {
        // JEI: показ рецептов тигля, магического верстака и наполнения (необязательная зависимость)
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    minecraft neoforge ? 'net.neoforged:forge:1.20.1-47.1.106' : 'net.minecraftforge:forge:1.20.1-47.4.0'
    // Curios API: ячейки для украшений (пояс, амулет, кольца) вместо Baubles оригинала
    compileOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.9.1+1.20.1:api')
    runtimeOnly fg.deobf('top.theillusivec4.curios:curios-forge:5.9.1+1.20.1')
    // TerraBlender: добавляет порченые земли в генерацию обычного мира, не трогая чужие биомы
    implementation fg.deobf('com.github.glitchfiend:TerraBlender-forge:1.20.1-3.0.1.7')
    // JEI: плагин компилируется против API; в игре JEI необязателен
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${jei_version}")
}

tasks.register('tinkererJar', Jar) {
    from sourceSets.tinkerer.output
    archiveBaseName = 'thaumictinkerer-1.20.1'
    archiveVersion = tinkerer_version
    manifest {
        attributes([
                'Specification-Title'   : 'thaumictinkerer',
                'Specification-Version' : '1',
                'Implementation-Title'  : 'thaumictinkerer',
                'Implementation-Version': tinkerer_version
        ])
    }
    finalizedBy 'reobfTinkererJar'
}
reobf {
    create('tinkererJar')
}
tasks.named('assemble') {
    dependsOn 'tinkererJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : 'thaumcraft',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version
        ])
    }
    finalizedBy 'reobfJar'
}
